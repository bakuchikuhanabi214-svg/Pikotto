    const midi = 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

    noiseBuf = ac.createBuffer(1, ac.sampleRate * .3, ac.sampleRate);

    o.connect(g).connect(master);

    }

      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 5.5; lg.gain.value = f * .006;
      lfo.connect(lg).connect(o.frequency); lfo.start(t + .12); lfo.stop(t + dur + .05);
    }
    const rel = kind === 'bass' ? .04 : .06;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.setValueAtTime(vol * .8, t + Math.max(.02, dur - rel)); g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + .02);
  }
  function drum(t, kind) {
    if (kind === 'k') {
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .15); o.connect(g).connect(master); o.start(t); o.stop(t + .16);
    } else {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf;
      f.type = kind === 'h' ? 'highpass' : 'bandpass'; f.frequency.value = kind === 'h' ? 7000 : 1800;
      const len = kind === 'h' ? .03 : .12, v = kind === 'h' ? .12 : .25;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
      s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + len + .01);
    }
  }

  // ------------------------------------------------------------- 再生
  function compile(tr) {
    const mel = seq(tr.mel), bass = seq(tr.bass), loop = mel.total;
    const ev = [];
    mel.notes.forEach(n => ev.push({ s: n.s, len: n.len, f: n.f, k: tr.lead, v: tr.lead === 'box' ? .55 : tr.lead === 'pulse' ? .32 : .5 }));
    bass.notes.forEach(n => ev.push({ s: n.s, len: n.len, f: n.f, k: tr.lead === 'box' ? 'sine' : 'bass', v: tr.lead === 'box' ? .45 : .55 }));
    tr.chords.forEach((ch, b) => {
      const s0 = b * tr.bar, fs = ch.map(freq);
      if (tr.pad === 'offbeat') for (let i = 2; i < tr.bar; i += 4) fs.forEach(f => ev.push({ s: s0 + i, len: 1.5, f, k: 'sine', v: .09 }));
      if (tr.pad === 'stab') for (let i = 2; i < tr.bar; i += 4) fs.forEach(f => ev.push({ s: s0 + i, len: 1, f, k: 'pulse', v: .06 }));
      if (tr.pad === 'waltz') [4, 8].forEach(i => fs.forEach(f => ev.push({ s: s0 + i, len: 2, f, k: 'box', v: .12 })));
      if (tr.pad === 'hold') fs.forEach(f => ev.push({ s: s0, len: tr.bar, f, k: 'sine', v: .07 }));
    });
    if (tr.drums) for (let b = 0; b < loop / tr.bar; b++) for (const k of ['k', 'h', 's']) [...tr.drums[k]].forEach((c, i) => { if (c === 'x') ev.push({ s: b * tr.bar + i, drum: k }); });
    ev.sort((a, b) => a.s - b.s);
    return { ev, loop, stepDur: 60 / tr.bpm / tr.spb };
  }
  function tick() {
    if (!cur) return;
    const ahead = ac.currentTime + .15;
    while (true) {
      const t = startAt + nextStep * cur.stepDur;
      if (t > ahead) break;
      const loopN = Math.floor(nextStep / cur.loop), local = nextStep - loopN * cur.loop;
      for (const e of cur.ev) if (e.s === local) { if (e.drum) drum(t, e.drum); else tone(t, e.f, e.len * cur.stepDur, e.k, e.v * cur.vol); }
      nextStep++;
    }
  }
  function play(id) {
    init(); if (ac.state === 'suspended') ac.resume();
    stop();
    const tr = TRACKS[id]; if (!tr) return;
    cur = Object.assign(compile(tr), { id, vol: tr.vol });
    startAt = ac.currentTime + .08; nextStep = 0;
    timer = setInterval(tick, 25); tick();
  }
  function stop() { if (timer) clearInterval(timer); timer = null; cur = null; }
  function setVolume(v) { volume = v; if (master) master.gain.setTargetAtTime(.14 * v, ac.currentTime, .05); }
  function beat() { if (!cur || !ac) return -1; return Math.floor((ac.currentTime - startAt) / cur.stepDur / 4); }
  return { TRACKS, play, stop, setVolume, beat, get playing() { return cur && cur.id; } };
})();

    R(0, 44, 64, 20, night ? '#2f4a33' : '#7cc46a');
    for (let x = 0; x < 64; x += 3) P(x, 44 + (x * 7) % 18, night ? '#26402a' : '#62b35a');
    for (let x = 18; x < 46; x++) for (let y = 50; y < 64; y++) { const dx = (x + .5 - 32) / 14, dy = (y + .5 - 58) / 6; if (dx*dx + dy*dy <= 1) P(x, y, night ? '#5a5048' : '#e6cf9a'); }
    for (const [fx, fy] of PARK_FL) { P(fx, fy, '#ff8fc0'); P(fx + 1, fy + 1, '#ffe066'); }
  } else if (place === 'beach') {
    R(0, 0, 64, 32, skyColor());
    if (!night) R(46, 6, 5, 5, '#fff3a0'); else { R(46, 6, 4, 4, '#fff6c4'); P(46, 6, skyColor()); }
    R(0, 32, 64, 12, night ? '#1f3a66' : '#3aa0e0');
    for (let i = 0; i < 12; i++) { const x = ((i * 13 + t / 90) % 70) - 4, y = 34 + (i * 5) % 9; R(x, y, 3, 1, night ? '#3a5a8a' : '#8fd3ff'); }
    R(0, 44, 64, 20, night ? '#8a7a60' : '#f2d9a0');
    for (let x = 0; x < 64; x++) { const fy = 44 + Math.round(Math.sin(x / 5 + t / 500)); P(x, fy, '#ffffff'); }

  } else {

    for (const s of HILL_ST) if (Math.sin(t / 400 + s[2] * 20) > -.3) P(s[0], s[1], s[2] > .8 ? '#fff6c4' : '#dfe6ff');
    R(48, 6, 6, 6, '#fff6c4'); R(48, 6, 3, 3, '#20264a'); R(48, 9, 1, 3, '#20264a');
    const sp = (t % 6000) / 6000; if (sp < .15) { const x = 10 + sp * 200, y = 4 + sp * 60; P(x, y, '#fff'); P(x - 1, y - .5, '#cfd8ff'); P(x - 2, y - 1, '#8f9ad8'); }
    for (let x = 0; x < 64; x++) { const h = 40 + Math.round(Math.sin(x / 12) * 3); R(x, h, 1, 64 - h, '#1f3a30'); P(x, h, '#2f5a46'); }
    for (const [fx, fy] of PARK_FL) if (Math.sin(t / 500 + fx) > 0) P(fx, fy, '#a8ffcf');
  }

// ============ たまご ============
function drawEgg(t) {
  let wob = 0;
  if (anim && anim.type === 'wobble') { const p = (t - anim.start) / anim.dur; wob = Math.sin(p * Math.PI * 4) * 1.5 * (1 - p); }
  else wob = Math.sin(t / 700) * .4;
  const cx = 32 + wob, cy = GROUND - 9, rx = 7, ry = 9;
  const d = (x, y) => { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / (y + .5 < cy ? ry : ry * .85); return dx*dx + dy*dy <= 1; };
  for (let x = 20; x < 44; x++) for (let y = 30; y < 58; y++) {
    if (!d(x, y)) continue;
    const edge = !d(x+1, y) || !d(x-1, y) || !d(x, y+1) || !d(x, y-1);
    let c = '#fffaf0';
    if (edge) c = '#5a4a3f';
    else if ((x - cx) + (y - cy) * .8 > 5) c = '#eadfcc';
    else { const ex = (x + .5 - cx) / rx, ey = (y + .5 - cy) / ry; for (const s of G.spots) if ((ex - s[0]) ** 2 + (ey - s[1]) ** 2 < (s[2] * .8) ** 2) c = (s[2] > .22) ? G.pal.b : G.pal.a; }
    P(x, y, c);
  }
  const crack = [[31,40],[32,41],[33,40],[34,41],[30,41],[29,40],[35,40],[36,41],[28,41],[37,40]];
  for (let i = 0; i < Math.min(S.eggTaps * 2, crack.length); i++) P(crack[i][0] + wob, crack[i][1], '#5a4a3f');
  R(cx - 6, GROUND + 1, 12, 1, 'rgba(0,0,0,.18)');
  petBox = { x0: cx - 9, x1: cx + 9, y0: cy - 11, y1: GROUND + 2 };
}

// ============ いきもの ============
function drawPet(t) {
  const pal = G.pal, st = STAGES[S.stage];
  const p = anim ? (t - anim.start) / anim.dur : 0;
  const asleep = !previewing && !drawingFriend && !visit && !mg && !trip && !reunion && isNight() && Date.now() > awakeUntil;
  let squash = Math.sin(t / (asleep ? 900 : 320)) * (asleep ? .04 : .06);
  let jump = 0, dx = 0, face = null, mouth = null, tear = false, sparkleFace = false;
  if (anim && !previewing) {
    if (anim.type === 'jump') { jump = Math.sin(p * Math.PI) * 5; squash = -.08 * Math.sin(p * Math.PI); face = 'happy'; mouth = 'open'; }
    if (anim.type === 'eat') { face = p < .85 ? 'normal' : 'happy'; mouth = (Math.floor(t / 160) % 2) ? 'open' : 'line'; }
    if (anim.type === 'listen') { dx = Math.sin(p * Math.PI * 2); face = 'normal'; mouth = 'line'; }
    if (anim.type === 'grow') { squash = Math.sin(p * Math.PI * 8) * .12; face = 'happy'; mouth = 'open'; }
    if (anim.type === 'proud') { jump = Math.abs(Math.sin(p * Math.PI * 2)) * 3; face = 'happy'; mouth = 'smile'; }
  }
  if (mg && !drawingFriend) {
    dx = mg.x - 32;
    if (t < mg.stun) { face = 'sad'; mouth = 'frown'; dx += Math.sin(t / 30); }
    else if (t < mg.happy) { face = 'happy'; mouth = 'open'; jump = 2; }
  }
  if (trip && !drawingFriend) {
    dx = trip.x - 32;
    if (trip.digUntil > t) { squash = Math.sin(t / 60) * .1; face = 'happy'; mouth = 'line'; }
    else if (trip.moving) jump = Math.abs(Math.sin(t / 110)) * 1.6;
    if (trip.happy > t) { face = 'happy'; mouth = 'open'; jump = Math.max(jump, 3); }
  }
  if (reunion && !previewing && !drawingFriend) {
    const rt = t - reunion.start;
    if (reunion.phase === 'sad') { face = 'sad'; mouth = 'frown'; squash = .09; tear = true; }
    else if (reunion.phase === 'notice') { face = 'normal'; mouth = 'open'; jump = Math.min(1, rt / 150) * 2; }
    else { face = 'super'; mouth = 'big'; const ph = Math.abs(Math.sin(rt / 1000 * Math.PI * 2.4)); jump = ph * 8; squash = -.07 * ph + (ph < .15 ? .08 : 0); sparkleFace = true; }
  }
  dx += extraDX;
  let rx = st.rx * (1 + squash), ry = st.ry * (1 - squash);
  if (G.shape === 'tall') { rx *= .85; ry *= 1.12; }
  if (G.shape === 'wide') { rx *= 1.15; ry *= .88; }
  const cx = 32 + dx, cy = GROUND - ry - jump, top = cy - ry;

  const inBody = (x, y) => {
    let ex = (x + .5 - cx) / rx; const ey = (y + .5 - cy) / ry;
    if (G.shape === 'pear') ex /= (.78 + .2 * (ey + 1));
    if (G.shape === 'bean') return Math.abs(ex) ** 2.6 + Math.abs(ey) ** 2.6 <= 1;
    return ex*ex + ey*ey <= 1;
  };
  const inEar = (x, y) => {
    if (!st.ears) return 0;
    const X = x + .5, Y = y + .5;
    for (const s of [-1, 1]) {
      if (G.ear === 'cat') {
        const exc = cx + s * rx * .55, h = 3 + st.ears, yy = Y - (top - h + 2);
        if (yy >= 0 && yy <= h && Math.abs(X - exc) <= yy * .55 + .3) return (Math.abs(X - exc) < yy * .28 && yy > 1.5) ? 3 : 2;
      } else if (G.ear === 'bunny') {
        const exc = cx + s * rx * .32, h = 4 + st.ears * 2, yy = Y - (top - h + 2);
        if (yy >= 0 && yy <= h && Math.abs(X - exc) <= 1.4) return (Math.abs(X - exc) < .7 && yy > 1.2 && yy < h - 1) ? 3 : 2;
      } else if (G.ear === 'round') {
        const exc = cx + s * rx * .62, rr = 1.8 + st.ears * .5, ddx = X - exc, ddy = Y - (top + 1);
        if (ddx*ddx + ddy*ddy <= rr*rr) return 2;
      }
    }
    return 0;
  };
  const inside = (x, y) => inBody(x, y) ? 1 : inEar(x, y);

  for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (Math.abs(x + .5 - cx) / rx < .9) P(x, GROUND + 1, 'rgba(0,0,0,.18)');
  if (st.ears && G.tail !== 'none') sprite(SPR.tail[G.tail], cx + rx - 2, cy - 1 + Math.sin(t / 250) * .6, { O: pal.o, B: pal.b, L: pal.l });
  const footC = G.pattern === 'socks' ? pal.ao : pal.o;
  R(Math.round(cx - rx * .5) - 1, GROUND - 1, 3, 2, footC);
  R(Math.round(cx + rx * .5) - 1, GROUND - 1, 3, 2, footC);
  const earH = 4 + st.ears * 2;
  const x0 = Math.floor(cx - rx - 3), x1 = Math.ceil(cx + rx + 3), y0 = Math.floor(top - earH - 2), y1 = Math.ceil(cy + ry + 1);
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const v = inside(x, y); if (!v) continue;
    const edge = !inside(x+1, y) || !inside(x-1, y) || !inside(x, y+1) || !inside(x, y-1);
    let c = pal.b;
    if (edge) c = pal.o;
    else if (v === 3) c = '#ff9fb4';
    else if (v === 1) {
      const ex = (x + .5 - cx) / rx, ey = (y + .5 - cy) / ry;
      switch (G.pattern) {
        case 'spots': for (const s of G.spots) if ((ex - s[0]) ** 2 + (ey - s[1]) ** 2 < s[2] ** 2) c = pal.a; break;
        case 'stripes': if (G.stripeV ? (Math.floor((ex + 1) * 4) % 2 === 0 && ey < .2) : (Math.floor((ey + 1) * 4.5) % 2 === 0 && ey < .1)) c = pal.a; break;
        case 'belly': if ((ex / .55) ** 2 + ((ey - .42) / .5) ** 2 < 1) c = '#fff6e6'; break;
        case 'patch': if ((ex + .36) ** 2 + (ey + .1) ** 2 < .1) c = pal.a; break;
        case 'socks': if (ey > .62) c = pal.a; break;
      }
      if (c === pal.b) {
        if (ex * .8 + ey > .78) c = pal.s;
        else if (ex < -.25 && ey < -.35 && ex*ex + ey*ey < .62) c = pal.l;
      }
    }
    P(x, y, c);
  }
  if (G.pattern === 'stars') for (const s of G.spots) {
    const sx = Math.round(cx + s[0] * rx * .8), sy = Math.round(cy + s[1] * ry * .8);
    if (inBody(sx, sy)) { P(sx, sy, '#fff8b0'); if (s[2] > .22) { P(sx - 1, sy, '#fff8b0'); P(sx + 1, sy, '#fff8b0'); P(sx, sy - 1, '#fff8b0'); P(sx, sy + 1, '#fff8b0'); } }
  }
  if (st.ears) {
    if (G.ear === 'horn') for (const s of [-1, 1]) { const hx = Math.round(cx + s * rx * .4); sprite(st.ears > 1 ? ['.O.', 'OAO', 'OAO', 'OAO'] : ['.O.', 'OAO', 'OAO'], hx - 1, Math.round(top) - 1 - st.ears - 2, { O: pal.ao, A: pal.a }); }
    if (G.ear === 'antenna') for (const s of [-1, 1]) { const hx = Math.round(cx + s * 2.5), h = 2 + st.ears; R(hx, Math.round(top) - h, 1, h + 1, pal.o); R(hx - (s < 0 ? 1 : 0), Math.round(top) - h - 2, 2, 2, pal.a); }
    if (G.ear === 'leaf') { const tx = Math.round(cx); R(tx, Math.round(top) - 2, 1, 3, '#3f7a39'); sprite(st.ears > 1 ? ['.GGG', 'GGLG', 'GG..'] : ['.GG', 'GLG'], tx, Math.round(top) - 4 - st.ears, { G: '#5fae55', L: '#9ee08f' }); }
  }
  const hatOn = !!S.wear.head;
  if (S.stage === 'adult') {
    const tx = Math.round(cx), ty = Math.round(top);
    if (G.acc === 'sprout' && !hatOn) { R(tx, ty - 3, 1, 3, '#3f7a39'); R(tx - 2, ty - 4, 2, 2, '#62b35a'); R(tx + 1, ty - 5, 2, 2, '#7fcc6f'); }
    if (G.acc === 'crown' && !hatOn) sprite(['Y.Y.Y', 'YYYYY', 'YRYBY'], tx - 2, ty - 2, { Y: '#ffcc33', R: '#ff4d6d', B: '#5ab4ff' });
    if (G.acc === 'flower') sprite(['.P.', 'PYP', '.P.'], Math.round(cx + rx * .5), ty + 1, { P: pal.a, Y: '#ffe066' });
    if (G.acc === 'halo') sprite(['.YYYYY.', 'Y.....Y', '.YYYYY.'], tx - 3, ty - 9 + Math.round(Math.sin(t / 400)), { Y: '#ffe066' });
    if (G.acc === 'bow') sprite(['R...R', 'RRYRR', 'R...R'], Math.round(cx - rx * .6) - 2, ty + 1, { R: '#ff4d6d', Y: '#ffd0da' });
    if (G.acc === 'star') sprite(['..Y..', '.YYY.', 'YYYYY', '.Y.Y.'], tx + Math.round(rx * .6), ty - 8 + Math.round(Math.sin(t / 350) * 1.5), { Y: '#ffe066' });
  }
  // 顔
  if (!face) face = asleep ? 'sleep' : (S.hunger < 25 || S.mood < 25) ? 'sad' : 'normal';
  if (face === 'normal' && t > nextBlink && !previewing) { face = 'blink'; if (t > nextBlink + 130) nextBlink = t + 2200 + Math.random() * 2500; }
  if (!mouth) mouth = face === 'sad' ? 'frown' : face === 'sleep' ? 'line' : (S.mood > 70 ? 'smile' : 'line');
  const o = pal.o, ew = G.eye === 'big' ? 3 : 2;
  const exL = Math.round(cx - rx * G.eyeGap) - 1 - (ew - 2), exR = Math.round(cx + rx * G.eyeGap), ey = Math.round(cy - 1);
  for (const ex of [exL, exR]) {
    if (face === 'normal' || face === 'sad') {
      if (G.eye === 'dot') R(ex, ey + 1, 2, 2, o);
      else if (G.eye === 'big') { R(ex, ey, 3, 3, o); P(ex, ey, '#fff'); }
      else if (G.eye === 'sleepy') { R(ex, ey + 1, 2, 2, o); R(ex, ey + 1, 2, 1, pal.s); }
      else if (G.eye === 'sparkle') { R(ex, ey, 2, 3, o); P(ex, ey, '#fff'); P(ex + 1, ey + 2, '#fff'); }
      else { R(ex, ey, 2, 3, o); P(ex, ey, '#fff'); }
    } else if (face === 'blink' || face === 'sleep') R(ex, ey + 2, ew, 1, o);
    else if (face === 'happy') { P(ex, ey + 1, o); P(ex + 1, ey, o); P(ex + 2, ey + 1, o); }
    else if (face === 'super') { P(ex - 1, ey + 2, o); P(ex, ey + 1, o); P(ex + 1, ey, o); P(ex + 2, ey + 1, o); P(ex + 3, ey + 2, o); }
  }
  if ((face === 'sad' && Math.floor(t / 600) % 2) || tear) { P(exL, ey + 3, '#5ab4ff'); P(exL, ey + 4 + (Math.floor(t / 300) % 2), '#5ab4ff'); if (tear) P(exR + 1, ey + 4, '#5ab4ff'); }
  if (G.cheek !== 'n' || face === 'super') {
    const ck = face === 'super' ? '#ff6f9a' : '#' + G.cheek;
    R(exL - 2, ey + 3, 2, 1, ck); R(exR + ew, ey + 3, 2, 1, ck);
    if (face === 'super') { R(exL - 2, ey + 4, 2, 1, ck); R(exR + ew, ey + 4, 2, 1, ck); }
  }
  const mx = Math.round((exL + ew + exR) / 2) - 1, my = ey + 4;
  if (mouth === 'big') { R(mx - 1, my, 4, 3, o); R(mx, my + 1, 2, 2, '#ff6f8f'); P(mx - 1, my, o); }
  else if (G.mouth === 'beak') {
    R(mx, my, 2, 1, '#ffa040');
    if (mouth === 'open') { P(mx, my + 1, '#ff6f8f'); P(mx + 1, my + 1, '#ff6f8f'); R(mx, my + 2, 2, 1, '#e07a20'); } else R(mx, my + 1, 2, 1, '#e07a20');
  } else if (mouth === 'open') { R(mx, my, 2, 2, o); P(mx, my + 1, '#ff6f8f'); P(mx + 1, my + 1, '#ff6f8f'); }
  else if (mouth === 'frown') { P(mx - 1, my + 1, o); R(mx, my, 2, 1, o); P(mx + 2, my + 1, o); }
  else if (G.mouth === 'cat') { P(mx - 1, my, o); P(mx, my + 1, o); P(mx + 1, my + 1, o); P(mx + 2, my, o); }
  else if (G.mouth === 'fang') { R(mx, my, 2, 1, o); P(mx + 1, my + 1, '#fff'); }
  else if (mouth === 'smile') { P(mx - 1, my, o); R(mx, my + 1, 2, 1, o); P(mx + 2, my, o); }
  else R(mx, my, 2, 1, o);

  drawWear(t, { cx, cy, rx, ry, top, exL, exR, ew, ey, inBody, st });

  if (sparkleFace && Math.random() < .25) particles.push({ k: 'spark', x: cx + (Math.random() - .5) * rx * 3, y: top - 2 + Math.random() * ry, vx: 0, vy: -.01, life: 400, born: t });
  if (anim && anim.type === 'eat') {
    const f = FOODS[eatFood], k = Math.max(0, Math.ceil(f.spr.length * (1 - p * 1.1)));
    sprite(f.spr.slice(f.spr.length - k), cx + rx + 2, GROUND - k, f.map);
  }
  if (anim && anim.type === 'listen') sprite(SPR.q, cx + rx - 1, top - 6, { X: '#3a2b3f' });
  if (reunion && reunion.phase === 'notice') sprite(SPR.ex, cx + rx, top - 7, { X: '#ff4d4d' });
  if (asleep && !anim && Math.random() < .012) particles.push({ k: 'z', x: cx + rx - 2, y: top - 2, vx: .05, vy: -.06, life: 1600, born: t });
  const box = { x0: cx - rx - 3, x1: cx + rx + 3, y0: top - (st.ears ? 4 : 2), y1: GROUND + 2 };
  if (drawingFriend) friendBox = box; else if (!previewing) petBox = box;
}

// ============ きせかえの描画 ============
function drawWear(t, g) {
  const { cx, cy, rx, ry, top, exL, exR, ew, ey, inBody } = g;
  const W = S.wear, X = Math.round(cx), T = Math.round(top);
  // くび
  const ny = Math.round(cy + ry * .6) + 1;
  if (W.neck === 'bowtie' || W.neck === 'r100') sprite(CLOTHES[W.neck].spr, X - 2, ny - 1, CLOTHES[W.neck].map);
  if (W.neck === 'scarf' || W.neck === 'bell' || W.neck === 'muffler') {
    const rows = W.neck === 'bell' ? 1 : 2;
    for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) for (let r = 0; r < rows; r++) if (inBody(x, ny + r))
      P(x, ny + r, W.neck === 'scarf' ? (r ? '#3f8ad0' : '#5ab4ff') : W.neck === 'bell' ? '#e04848' : (x % 2 ? '#ff6b6b' : '#fff3e0'));
    if (W.neck === 'scarf') { R(X + 2, ny + 2, 2, 3, '#3f8ad0'); }
    if (W.neck === 'muffler') { R(X - 4, ny + 2, 2, 3, '#ff6b6b'); P(X - 4, ny + 3, '#fff3e0'); }
    if (W.neck === 'bell') sprite(['.Y.', 'YYY', 'YKY'], X - 1, ny + 1, { Y: '#ffd84d', K: '#7a5a00' });
  }
  // かお
  if (W.face === 'roundg') {
    const c = '#c99a2e';
    for (const ex of [exL, exR]) { R(ex - 1, ey - 1, ew + 2, 1, c); R(ex - 1, ey + 3, ew + 2, 1, c); R(ex - 1, ey - 1, 1, 5, c); R(ex + ew, ey - 1, 1, 5, c); }
    if (exR - 2 >= exL + ew + 1) R(exL + ew + 1, ey, exR - exL - ew - 2, 1, c);
  }
  if (W.face === 'sun') {
    for (const ex of [exL, exR]) { R(ex - 1, ey, ew + 2, 3, '#1d1b22'); P(ex, ey, '#8a8aa0'); }
    R(exL + ew, ey, Math.max(1, exR - exL - ew), 1, '#1d1b22');
  }
  if (W.face === 'heartg') {
    for (const ex of [exL, exR]) sprite(['.X.X.', 'XXXXX', '.XXX.', '..X..'], ex - 1 - (ew === 3 ? 0 : .5), ey - 1, { X: '#ff5c86' });
    R(exL + ew + 1, ey, Math.max(1, exR - exL - ew - 2), 1, '#ff5c86');
  }
  // あたま
  const h = W.head; if (!h) return;
  const C = CLOTHES[h];
  if (h === 'straw') sprite(C.spr, X - 5, T - 2, C.map);
  else if (h === 'knit') sprite(C.spr, X - 4, T - 2, C.map);
  else if (h === 'witch') sprite(C.spr, X - 5, T - 4, C.map);
  else if (h === 'silk') sprite(C.spr, X - 4, T - 4, C.map);
  else if (h === 'tiara') sprite(C.spr, X - 3, T - 1, C.map);
  else if (h === 'santa') sprite(C.spr, X - 4, T - 4, C.map);
  else if (h === 'pumpkin') sprite(C.spr, X - 4, T - 3, C.map);
  else if (h === 'fcrown') sprite(C.spr, X - 4, T, C.map);
  else if (h === 'shellpin') sprite(C.spr, Math.round(cx + rx * .35), T + 1, C.map);
  else if (h === 'starpin') { sprite(C.spr, Math.round(cx + rx * .3), T - 1, C.map); if (Math.floor(t / 500) % 2) P(Math.round(cx + rx * .3) + 5, T - 2, '#fff'); }

    for (let x = Math.ceil(cx - rx + 1); x <= cx + rx - 1; x++) { let y = Math.floor(top - 2); while (y < cy && !inBody(x, y)) y++; P(x, y - 1, '#3a3a48'); }

function setUIBusy(b) {
  const egg = S.stage === 'egg';
  ['#aFeed', '#aPlay', '#aTeach', '#aWear', '#aShop', '#aPhoto', '#aTreasure', '#aNote', '#mBtn', '#btnSettings', '#btnFriend'].forEach(id => {
    let dis = b || (egg && id !== '#btnSettings' && id !== '#btnFriend');

}
const busy = () => mg || trip || reunion || (anim && ['eat', 'grow'].includes(anim.type));
function wake() { if (isNight() && Date.now() > awakeUntil) { awakeUntil = Date.now() + 3 * 60000; return true; } return false; }
const toLogical = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 64, y: (e.clientY - r.top) / r.height * 64 }; };

function onCanvasTap(e) {
  const { x: lx, y: ly } = toLogical(e);
  if (mg) { mg.target = lx; return; }
  if (reunion) return;
  const hit = lx >= petBox.x0 && lx <= petBox.x1 && ly >= petBox.y0 && ly <= petBox.y1;
  if (trip) {
    if (trip.ending || trip.digUntil) return;
    const s = trip.spots.find(s => Math.abs(lx - s.x) < 5 && ly > GROUND - 10);
    if (s) { trip.dig = s; trip.target = s.x; blip(800, .04, .03); return; }
    if (hit) { hearts(); trip.happy = performance.now() + 500; S.mood = clamp(S.mood + 2); if (Math.random() < .5) say(talk('play')); return; }
    if (!trip.dig) { trip.target = clamp(lx, 8, 56); trip.wanderAt = performance.now() + 3000; }
    return;
  }
  if (visit) {
    const fb = friendBox;
    if (lx >= fb.x0 && lx <= fb.x1 && ly >= fb.y0 && ly <= fb.y1 && !visit.leaving) {
      visit.fanim = { type: 'jump', start: performance.now(), dur: 500 }; buzz();
      const t = performance.now(); for (let i = 0; i < 2; i++) particles.push({ k: 'heart', x: (fb.x0 + fb.x1) / 2 - 3 + Math.random() * 4, y: fb.y0, vx: 0, vy: -.03, life: 1000, born: t + i * 80 });
      if (Math.random() < .6) say(`${visit.f.name}「${visit.f.words.length ? pick(visit.f.words) : 'ぴ！'}」`);
      return;
    }
  }
  if (S.stage !== 'egg' && S.player && !visit) {
    if (pendingGift() && lx >= 3 && lx <= 11 && ly >= 48 && ly <= 57) { buzz(); openGift(); return; }
    if (S.egg && lx >= 53 && lx <= 62 && ly >= 44 && ly <= 55) { buzz(); openEggInfo(); return; }
  }
  if (!hit) return;
  buzz();
  if (S.stage === 'egg') {
    S.eggTaps++; startAnim('wobble', 450); blip(300 + S.eggTaps * 80, .08, .05, 'triangle');
    if (S.eggTaps >= 5) {
      flash = 1.5; jingle();
      const wait = new Promise(r => setTimeout(r, 900));
      Promise.all([ensureUnique(), wait]).then(() => { S.stage = 'baby'; save(); updateUI(); openNaming(); });
    } else save();
    return;
  }
  if (busy()) return;
  if (wake()) { startAnim('listen', 900); say('…ん…？\n（ねむそう）'); return; }
  hearts();
  if (S.today.pets < 15) { S.affection += 1; S.today.pets++; }
  S.mood = clamp(S.mood + 3);
  startAnim('jump', 500);
  save(); updateUI(); prog('pet');
  if (checkGrowth() || checkName()) return;
  if (Math.random() < .55) say(talk('pet')); else blip(G.voice + 200, .06);
}

function teach(word) {
  const today = dayStr(now());
  let w = S.words.find(x => x.t === word);
  if (w && w.learned) { closeModal(); wake(); startAnim('jump', 500); say(`${word}！\n（もう知ってるよ、という顔）`); return; }
  if (w && w.lastDay === today) { $('#tErr').textContent = 'そのことばは きょうはもう聞かせたよ。また明日！'; return; }
  closeModal(); wake();
  S.today.teach++; S.affection += 3;
  if (!w) { w = { t: word, n: 0, lastDay: '', learned: false }; S.words.push(w); }
  w.n++; w.lastDay = today;
  const cs = chars(word);
  startAnim('listen', 1300); prog('teach');
  setTimeout(() => {
    if (w.n >= need()) {
      w.learned = true; w.learnedAt = now();
      startAnim('jump', 700); confetti(); jingle();
      say(`${word}！ ${word}！`);
      diary(`「${word}」を覚えた！`);

    save(); updateUI(); checkGrowth();
  }, 1300);
  save(); updateUI();
}

function applyRestore(data, from) {
  let o; try { o = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return false; }
  if (!o || typeof o !== 'object' || !/^[0-9a-f]{12}$/.test(o.seed || '')) return false;
  openModal(`
    <h2>このデータで ひきつぐ？</h2>
    <p>「${esc(o.pet || 'たまご')}」（${o.gen || 1}だいめ・いっしょに${o.days || 0}日・コイン${o.coins || 0}）</p>
    <p style="color:#c0392b">いま この画面にいる ${esc(S.pet || 'たまご')}の データは うわがきされて 消えます。</p>
    <div class="row"><button class="btn sub" id="rsNo">やめる</button><button class="btn danger" id="rsYes">ひきつぐ</button></div>`);
  $('#rsNo').onclick = closeModal;
  $('#rsYes').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify(Object.assign(o, { dbg: 0, synced: '' }))); } catch (e) {} S = load(); G = makeGenes(S.seed, S.ov); diary(`${from}で データを ひきついだ`); location.reload(); };
  return true;
}
function openRestore(msg = '') {
  openModal(`
    <h2>コードで ひきつぐ</h2>
    <p>まえの スマホや パソコンで つくった「ひきつぎコード」を 入れてね。</p>
    <form id="rsF"><input id="rsCode" maxlength="20" placeholder="例：K7QM-2XPA-9DTE" autocomplete="off" style="text-transform:uppercase">
      <div class="err" id="rsMsg">${esc(msg)}</div>
      <div class="row" style="margin-top:4px"><button class="btn sub" type="button" id="rsC">やめる</button><button class="btn" type="submit">しらべる</button></div></form>`);
  $('#rsC').onclick = closeModal;
  $('#rsF').onsubmit = async e => {
    e.preventDefault();
    const code = $('#rsCode').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 12) return openRestore('コードは 12もじ だよ');
    $('#rsMsg').style.color = '#2a8a3a'; $('#rsMsg').textContent = 'さがしているよ…';
    const r = await api('/api/backup/' + code, { timeout: 10000 });
    if (r.status === 404) return openRestore('その コードは 見つからなかった（まちがい か、きげん切れ かも）');
    if (!r.ok || !r.data.data) return openRestore(SERVER_NG);
    if (!applyRestore(r.data.data, 'ひきつぎコード')) openRestore('データが こわれているみたい');
  };
}

// ============ 通知（アプリ版：Capacitorのローカル通知） ============
async function scheduleNotif() {
  try {
    const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (!LN || S.stage === 'egg' || !S.pet) return;
    await LN.requestPermissions();
    await LN.cancel({ notifications: [{ id: 1 }, { id: 2 }] });
    const at = days => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(19, 0, 0, 0); return d; };
    const pn = S.nameLevel >= 2 ? S.player : null;
    await LN.schedule({ notifications: [
      { id: 1, title: S.pet, body: pn ? `「${pn}、まだかな…？」` : `${S.pet}が まってるよ`, schedule: { at: at(1) } },
      { id: 2, title: S.pet, body: pn ? `「${pn}…さみしいよ…」` : `${S.pet}が さみしそうにしているよ…`, schedule: { at: at(3) } },
    ] });
  } catch (e) {}
}

// ============ BGM（場面ごとに自動で切りかえ） ============
let audioUnlocked = false;
function wantTrack() {
  if (mg) return 'march';
  if (trip) return trip.place === 'hill' ? 'lullaby' : 'march';
  if (isNight()) return 'lullaby';
  if (hour() >= 17) return 'waltz';
  return 'pokapoka';
}
function updateBGM() {
  const btn = $('#btnBgm');
  btn.classList.toggle('off', !S.bgm); btn.setAttribute('aria-pressed', S.bgm ? 'true' : 'false');
  if (!audioUnlocked || !S.bgm || document.hidden) { if (PikoBGM.playing) PikoBGM.stop(); return; }
  const w = wantTrack();
  if (PikoBGM.playing !== w) { try { PikoBGM.play(w); } catch (e) {} }
}
function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; updateBGM(); }
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
PikoBGM.setVolume(.55);

// ============ 起動 ============
cv.addEventListener('pointerdown', onCanvasTap);
cv.addEventListener('pointermove', e => { if (mg) mg.target = toLogical(e).x; });
$('#aFeed').onclick = openFeed;
$('#aPlay').onclick = openPlay;
$('#aTeach').onclick = openTeach;
$('#aWear').onclick = () => openWear();
$('#aShop').onclick = () => openShop();
$('#aPhoto').onclick = takePhoto;
$('#aTreasure').onclick = () => openTreasure();
$('#aNote').onclick = () => openNote();
$('#mBtn').onclick = openMissions;
$('#btnSettings').onclick = openSettings;
$('#btnFriend').onclick = () => openFriends();
$('#btnBgm').onclick = () => { S.bgm = !S.bgm; save(); audioUnlocked = true; updateBGM(); toast(S.bgm ? 'BGM オン' : 'BGM オフ'); };
$('#tripBack').onclick = () => { if (visit) { endVisit(); return; } if (trip && !trip.ending) { trip.ending = true; say('（おうちに かえろう）'); setTimeout(endTrip, 900); } };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { applyDecay(); save(); scheduleNotif(); }
  else { applyDecay(); if (!mg && !trip && dayCheck()) greet(); updateUI(); }
  updateBGM();
});

if (location.hash === '#debug') {
  $('#debug').style.display = 'flex';
  $('#debug').onclick = e => {
    const d = e.target.dataset.d; if (!d || mg || trip) return;
    if (d === 'day') { S.dbg = (S.dbg || 0) + 1; applyDecay(); if (dayCheck()) greet(); }
    if (d === 'away') { S.dbg = (S.dbg || 0) + 3; applyDecay(); if (dayCheck()) greet(); }
    if (d === 'grow') { if (S.stage === 'baby') { S.days = Math.max(S.days, 3); S.affection = Math.max(S.affection, 20); } else if (S.stage === 'child') { S.days = Math.max(S.days, 7); S.affection = Math.max(S.affection, 60); } checkGrowth(); }
    if (d === 'hungry') S.hunger = clamp(S.hunger - 50);
    if (d === 'coin') S.coins += 100;
    if (d === 'reroll') { S.seed = newSeed(); G = makeGenes(S.seed, S.ov); }
    if (d === 'd30') { S.days += 29; S.affection = Math.max(S.affection, 160); S.dbg = (S.dbg || 0) + 1; applyDecay(); if (dayCheck()) greet(); }
    if (d === 'fake') { const id = newSeed(); S.friends.push({ id, name: pick(['もちこ', 'ぷにお', 'ころん']), stage: 'adult', wear: { head: 'straw' }, ov: null, gen: 1, words: ['やっほー', 'すき', 'おでかけ', 'たのしい'], visits: 2, addedAt: now() }); }
    if (d === 'xmas') { const n = new Date(); const tgt = new Date(n.getFullYear(), 11, 24, n.getHours()); S.dbg = Math.round((tgt - n) / DAY); applyDecay(); if (dayCheck()) greet(); }
    if (d === 'reset') confirmReset();
    save(); updateUI();
  };
}

drawIcons();
updateBGM();
applyDecay();
dayCheck();
updateUI();
if (S.stage !== 'egg' && !S.player) openNaming();
else if (S.stage === 'egg') setTimeout(() => say(S.eggTaps ? '（たまごが うごいた気がする…）' : '（ふしぎなたまごをひろった。\nタップしてみよう）'), 500);
else greet();
setInterval(() => { updateBGM(); if (!mg && !trip && !reunion) { applyDecay(); if (dayCheck()) greet(); save(); updateUI(); } }, 20000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
