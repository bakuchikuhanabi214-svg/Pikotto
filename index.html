  function freq(n) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); if (!m) return 0;
    const midi = 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

  // "E5:2 G5:2 -:4" → [{s,len,f}]

    const out = []; let s = 0;

      if (tok === '|') return;
      const [n, l] = tok.split(':'); const len = +l;

      s += len;
    });

    const edge = !d(x+1, y) || !d(x-1, y) || !d(x, y+1) || !d(x, y-1);

// ============ いきもの ============
function drawPet(t) {
  const pal = G.pal, st = STAGES[S.stage];
  const p = anim ? (t - anim.start) / anim.dur : 0;
  const asleep = !previewing && !mg && !trip && !reunion && isNight() && Date.now() > awakeUntil;
  let squash = Math.sin(t / (asleep ? 900 : 320)) * (asleep ? .04 : .06);
  let jump = 0, dx = 0, face = null, mouth = null, tear = false, sparkleFace = false;
  if (anim && !previewing) {
    if (anim.type === 'jump') { jump = Math.sin(p * Math.PI) * 5; squash = -.08 * Math.sin(p * Math.PI); face = 'happy'; mouth = 'open'; }
    if (anim.type === 'eat') { face = p < .85 ? 'normal' : 'happy'; mouth = (Math.floor(t / 160) % 2) ? 'open' : 'line'; }
    if (anim.type === 'listen') { dx = Math.sin(p * Math.PI * 2); face = 'normal'; mouth = 'line'; }
    if (anim.type === 'grow') { squash = Math.sin(p * Math.PI * 8) * .12; face = 'happy'; mouth = 'open'; }
    if (anim.type === 'proud') { jump = Math.abs(Math.sin(p * Math.PI * 2)) * 3; face = 'happy'; mouth = 'smile'; }
  }
  if (mg) {
    dx = mg.x - 32;
    if (t < mg.stun) { face = 'sad'; mouth = 'frown'; dx += Math.sin(t / 30); }
    else if (t < mg.happy) { face = 'happy'; mouth = 'open'; jump = 2; }
  }
  if (trip) {
    dx = trip.x - 32;
    if (trip.digUntil > t) { squash = Math.sin(t / 60) * .1; face = 'happy'; mouth = 'line'; }
    else if (trip.moving) jump = Math.abs(Math.sin(t / 110)) * 1.6;
    if (trip.happy > t) { face = 'happy'; mouth = 'open'; jump = Math.max(jump, 3); }
  }
  if (reunion && !previewing) {
    const rt = t - reunion.start;
    if (reunion.phase === 'sad') { face = 'sad'; mouth = 'frown'; squash = .09; tear = true; }
    else if (reunion.phase === 'notice') { face = 'normal'; mouth = 'open'; jump = Math.min(1, rt / 150) * 2; }
    else { face = 'super'; mouth = 'big'; const ph = Math.abs(Math.sin(rt / 1000 * Math.PI * 2.4)); jump = ph * 8; squash = -.07 * ph + (ph < .15 ? .08 : 0); sparkleFace = true; }
  }
  let rx = st.rx * (1 + squash), ry = st.ry * (1 - squash);
  if (G.shape === 'tall') { rx *= .85; ry *= 1.12; }
  if (G.shape === 'wide') { rx *= 1.15; ry *= .88; }
  const cx = 32 + dx, cy = GROUND - ry - jump, top = cy - ry;

  const inBody = (x, y) => {
    let ex = (x + .5 - cx) / rx; const ey = (y + .5 - cy) / ry;
    if (G.shape === 'pear') ex /= (.78 + .2 * (ey + 1));
    if (G.shape === 'bean') return Math.abs(ex) ** 2.6 + Math.abs(ey) ** 2.6 <= 1;
    return ex*ex + ey*ey <= 1;
  };
  const inEar = (x, y) => {
    if (!st.ears) return 0;
    const X = x + .5, Y = y + .5;
    for (const s of [-1, 1]) {
      if (G.ear === 'cat') {
        const exc = cx + s * rx * .55, h = 3 + st.ears, yy = Y - (top - h + 2);
        if (yy >= 0 && yy <= h && Math.abs(X - exc) <= yy * .55 + .3) return (Math.abs(X - exc) < yy * .28 && yy > 1.5) ? 3 : 2;
      } else if (G.ear === 'bunny') {
        const exc = cx + s * rx * .32, h = 4 + st.ears * 2, yy = Y - (top - h + 2);
        if (yy >= 0 && yy <= h && Math.abs(X - exc) <= 1.4) return (Math.abs(X - exc) < .7 && yy > 1.2 && yy < h - 1) ? 3 : 2;
      } else if (G.ear === 'round') {
        const exc = cx + s * rx * .62, rr = 1.8 + st.ears * .5, ddx = X - exc, ddy = Y - (top + 1);
        if (ddx*ddx + ddy*ddy <= rr*rr) return 2;
      }
    }
    return 0;
  };
  const inside = (x, y) => inBody(x, y) ? 1 : inEar(x, y);

  for (let x = Math.floor(cx - rx); x <= cx + rx; x++) if (Math.abs(x + .5 - cx) / rx < .9) P(x, GROUND + 1, 'rgba(0,0,0,.18)');
  if (st.ears && G.tail !== 'none') sprite(SPR.tail[G.tail], cx + rx - 2, cy - 1 + Math.sin(t / 250) * .6, { O: pal.o, B: pal.b, L: pal.l });
  const footC = G.pattern === 'socks' ? pal.ao : pal.o;
  R(Math.round(cx - rx * .5) - 1, GROUND - 1, 3, 2, footC);
  R(Math.round(cx + rx * .5) - 1, GROUND - 1, 3, 2, footC);
  const earH = 4 + st.ears * 2;
  const x0 = Math.floor(cx - rx - 3), x1 = Math.ceil(cx + rx + 3), y0 = Math.floor(top - earH - 2), y1 = Math.ceil(cy + ry + 1);
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const v = inside(x, y); if (!v) continue;
    const edge = !inside(x+1, y) || !inside(x-1, y) || !inside(x, y+1) || !inside(x, y-1);
    let c = pal.b;
    if (edge) c = pal.o;
    else if (v === 3) c = '#ff9fb4';
    else if (v === 1) {
      const ex = (x + .5 - cx) / rx, ey = (y + .5 - cy) / ry;
      switch (G.pattern) {
        case 'spots': for (const s of G.spots) if ((ex - s[0]) ** 2 + (ey - s[1]) ** 2 < s[2] ** 2) c = pal.a; break;
        case 'stripes': if (G.stripeV ? (Math.floor((ex + 1) * 4) % 2 === 0 && ey < .2) : (Math.floor((ey + 1) * 4.5) % 2 === 0 && ey < .1)) c = pal.a; break;
        case 'belly': if ((ex / .55) ** 2 + ((ey - .42) / .5) ** 2 < 1) c = '#fff6e6'; break;
        case 'patch': if ((ex + .36) ** 2 + (ey + .1) ** 2 < .1) c = pal.a; break;
        case 'socks': if (ey > .62) c = pal.a; break;
      }
      if (c === pal.b) {
        if (ex * .8 + ey > .78) c = pal.s;
        else if (ex < -.25 && ey < -.35 && ex*ex + ey*ey < .62) c = pal.l;
      }
    }
    P(x, y, c);
  }
  if (G.pattern === 'stars') for (const s of G.spots) {
    const sx = Math.round(cx + s[0] * rx * .8), sy = Math.round(cy + s[1] * ry * .8);
    if (inBody(sx, sy)) { P(sx, sy, '#fff8b0'); if (s[2] > .22) { P(sx - 1, sy, '#fff8b0'); P(sx + 1, sy, '#fff8b0'); P(sx, sy - 1, '#fff8b0'); P(sx, sy + 1, '#fff8b0'); } }
  }
  if (st.ears) {
    if (G.ear === 'horn') for (const s of [-1, 1]) { const hx = Math.round(cx + s * rx * .4); sprite(st.ears > 1 ? ['.O.', 'OAO', 'OAO', 'OAO'] : ['.O.', 'OAO', 'OAO'], hx - 1, Math.round(top) - 1 - st.ears - 2, { O: pal.ao, A: pal.a }); }
    if (G.ear === 'antenna') for (const s of [-1, 1]) { const hx = Math.round(cx + s * 2.5), h = 2 + st.ears; R(hx, Math.round(top) - h, 1, h + 1, pal.o); R(hx - (s < 0 ? 1 : 0), Math.round(top) - h - 2, 2, 2, pal.a); }
    if (G.ear === 'leaf') { const tx = Math.round(cx); R(tx, Math.round(top) - 2, 1, 3, '#3f7a39'); sprite(st.ears > 1 ? ['.GGG', 'GGLG', 'GG..'] : ['.GG', 'GLG'], tx, Math.round(top) - 4 - st.ears, { G: '#5fae55', L: '#9ee08f' }); }
  }
  const hatOn = !!S.wear.head;
  if (S.stage === 'adult') {
    const tx = Math.round(cx), ty = Math.round(top);
    if (G.acc === 'sprout' && !hatOn) { R(tx, ty - 3, 1, 3, '#3f7a39'); R(tx - 2, ty - 4, 2, 2, '#62b35a'); R(tx + 1, ty - 5, 2, 2, '#7fcc6f'); }
    if (G.acc === 'crown' && !hatOn) sprite(['Y.Y.Y', 'YYYYY', 'YRYBY'], tx - 2, ty - 2, { Y: '#ffcc33', R: '#ff4d6d', B: '#5ab4ff' });
    if (G.acc === 'flower') sprite(['.P.', 'PYP', '.P.'], Math.round(cx + rx * .5), ty + 1, { P: pal.a, Y: '#ffe066' });
    if (G.acc === 'halo') sprite(['.YYYYY.', 'Y.....Y', '.YYYYY.'], tx - 3, ty - 9 + Math.round(Math.sin(t / 400)), { Y: '#ffe066' });
    if (G.acc === 'bow') sprite(['R...R', 'RRYRR', 'R...R'], Math.round(cx - rx * .6) - 2, ty + 1, { R: '#ff4d6d', Y: '#ffd0da' });
    if (G.acc === 'star') sprite(['..Y..', '.YYY.', 'YYYYY', '.Y.Y.'], tx + Math.round(rx * .6), ty - 8 + Math.round(Math.sin(t / 350) * 1.5), { Y: '#ffe066' });
  }
  // 顔
  if (!face) face = asleep ? 'sleep' : (S.hunger < 25 || S.mood < 25) ? 'sad' : 'normal';
  if (face === 'normal' && t > nextBlink && !previewing) { face = 'blink'; if (t > nextBlink + 130) nextBlink = t + 2200 + Math.random() * 2500; }
  if (!mouth) mouth = face === 'sad' ? 'frown' : face === 'sleep' ? 'line' : (S.mood > 70 ? 'smile' : 'line');
  const o = pal.o, ew = G.eye === 'big' ? 3 : 2;
  const exL = Math.round(cx - rx * G.eyeGap) - 1 - (ew - 2), exR = Math.round(cx + rx * G.eyeGap), ey = Math.round(cy - 1);
  for (const ex of [exL, exR]) {
    if (face === 'normal' || face === 'sad') {
      if (G.eye === 'dot') R(ex, ey + 1, 2, 2, o);
      else if (G.eye === 'big') { R(ex, ey, 3, 3, o); P(ex, ey, '#fff'); }
      else if (G.eye === 'sleepy') { R(ex, ey + 1, 2, 2, o); R(ex, ey + 1, 2, 1, pal.s); }
      else if (G.eye === 'sparkle') { R(ex, ey, 2, 3, o); P(ex, ey, '#fff'); P(ex + 1, ey + 2, '#fff'); }
      else { R(ex, ey, 2, 3, o); P(ex, ey, '#fff'); }
    } else if (face === 'blink' || face === 'sleep') R(ex, ey + 2, ew, 1, o);
    else if (face === 'happy') { P(ex, ey + 1, o); P(ex + 1, ey, o); P(ex + 2, ey + 1, o); }
    else if (face === 'super') { P(ex - 1, ey + 2, o); P(ex, ey + 1, o); P(ex + 1, ey, o); P(ex + 2, ey + 1, o); P(ex + 3, ey + 2, o); }

  if (mouth === 'big') { R(mx - 1, my, 4, 3, o); R(mx, my + 1, 2, 2, '#ff6f8f'); P(mx - 1, my, o); }
  else if (G.mouth === 'beak') {
    R(mx, my, 2, 1, '#ffa040');
    if (mouth === 'open') { P(mx, my + 1, '#ff6f8f'); P(mx + 1, my + 1, '#ff6f8f'); R(mx, my + 2, 2, 1, '#e07a20'); } else R(mx, my + 1, 2, 1, '#e07a20');
  } else if (mouth === 'open') { R(mx, my, 2, 2, o); P(mx, my + 1, '#ff6f8f'); P(mx + 1, my + 1, '#ff6f8f'); }
  else if (mouth === 'frown') { P(mx - 1, my + 1, o); R(mx, my, 2, 1, o); P(mx + 2, my + 1, o); }
  else if (G.mouth === 'cat') { P(mx - 1, my, o); P(mx, my + 1, o); P(mx + 1, my + 1, o); P(mx + 2, my, o); }
  else if (G.mouth === 'fang') { R(mx, my, 2, 1, o); P(mx + 1, my + 1, '#fff'); }

  else R(mx, my, 2, 1, o);

  drawWear(t, { cx, cy, rx, ry, top, exL, exR, ew, ey, inBody, st });

  if (sparkleFace && Math.random() < .25) particles.push({ k: 'spark', x: cx + (Math.random() - .5) * rx * 3, y: top - 2 + Math.random() * ry, vx: 0, vy: -.01, life: 400, born: t });

// ============ きせかえの描画 ============
function drawWear(t, g) {
  const { cx, cy, rx, ry, top, exL, exR, ew, ey, inBody } = g;
  const W = S.wear, X = Math.round(cx), T = Math.round(top);
  // くび
  const ny = Math.round(cy + ry * .6) + 1;
  if (W.neck === 'bowtie') sprite(CLOTHES.bowtie.spr, X - 2, ny - 1, CLOTHES.bowtie.map);
  if (W.neck === 'scarf' || W.neck === 'bell' || W.neck === 'muffler') {
    const rows = W.neck === 'bell' ? 1 : 2;
    for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) for (let r = 0; r < rows; r++) if (inBody(x, ny + r))
      P(x, ny + r, W.neck === 'scarf' ? (r ? '#3f8ad0' : '#5ab4ff') : W.neck === 'bell' ? '#e04848' : (x % 2 ? '#ff6b6b' : '#fff3e0'));
    if (W.neck === 'scarf') { R(X + 2, ny + 2, 2, 3, '#3f8ad0'); }
    if (W.neck === 'muffler') { R(X - 4, ny + 2, 2, 3, '#ff6b6b'); P(X - 4, ny + 3, '#fff3e0'); }
    if (W.neck === 'bell') sprite(['.Y.', 'YYY', 'YKY'], X - 1, ny + 1, { Y: '#ffd84d', K: '#7a5a00' });
  }
  // かお
  if (W.face === 'roundg') {
    const c = '#c99a2e';
    for (const ex of [exL, exR]) { R(ex - 1, ey - 1, ew + 2, 1, c); R(ex - 1, ey + 3, ew + 2, 1, c); R(ex - 1, ey - 1, 1, 5, c); R(ex + ew, ey - 1, 1, 5, c); }
    if (exR - 2 >= exL + ew + 1) R(exL + ew + 1, ey, exR - exL - ew - 2, 1, c);
  }
  if (W.face === 'sun') {
    for (const ex of [exL, exR]) { R(ex - 1, ey, ew + 2, 3, '#1d1b22'); P(ex, ey, '#8a8aa0'); }
    R(exL + ew, ey, Math.max(1, exR - exL - ew), 1, '#1d1b22');
  }
  if (W.face === 'heartg') {
    for (const ex of [exL, exR]) sprite(['.X.X.', 'XXXXX', '.XXX.', '..X..'], ex - 1 - (ew === 3 ? 0 : .5), ey - 1, { X: '#ff5c86' });
    R(exL + ew + 1, ey, Math.max(1, exR - exL - ew - 2), 1, '#ff5c86');
  }
  // あたま
  const h = W.head; if (!h) return;
  const C = CLOTHES[h];
  if (h === 'straw') sprite(C.spr, X - 5, T - 2, C.map);
  else if (h === 'knit') sprite(C.spr, X - 4, T - 2, C.map);
  else if (h === 'witch') sprite(C.spr, X - 5, T - 4, C.map);
  else if (h === 'silk') sprite(C.spr, X - 4, T - 4, C.map);
  else if (h === 'tiara') sprite(C.spr, X - 3, T - 1, C.map);
  else if (h === 'fcrown') sprite(C.spr, X - 4, T, C.map);
  else if (h === 'shellpin') sprite(C.spr, Math.round(cx + rx * .35), T + 1, C.map);
  else if (h === 'starpin') { sprite(C.spr, Math.round(cx + rx * .3), T - 1, C.map); if (Math.floor(t / 500) % 2) P(Math.round(cx + rx * .3) + 5, T - 2, '#fff'); }
  else if (h === 'phones') {
    for (let x = Math.ceil(cx - rx + 1); x <= cx + rx - 1; x++) { let y = Math.floor(top - 2); while (y < cy && !inBody(x, y)) y++; P(x, y - 1, '#3a3a48'); }
    R(Math.round(cx - rx) - 1, Math.round(cy - ry * .45), 2, 4, '#ff5a7a'); R(Math.round(cx + rx) - 1, Math.round(cy - ry * .45), 2, 4, '#ff5a7a');
  } else if (h === 'band') {
    const hy = ey - 2;
    for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) if (inBody(x, hy)) P(x, hy, '#ff4d4d');
    let ex = Math.ceil(cx + rx); while (ex > cx && !inBody(ex, hy)) ex--;
    P(ex + 1, hy, '#ff4d4d'); P(ex + 2, hy + 1, '#ff4d4d'); P(ex + 2, hy - 1, '#ff4d4d');
  }
}

function drawParticles(t, dt) {
  particles = particles.filter(q => t - q.born < q.life);
  for (const q of particles) {
    if (t < q.born) continue;
    q.x += q.vx * dt; q.y += q.vy * dt; if (q.g) q.vy += q.g * dt;
    if (q.k === 'heart') sprite(SPR.heart, q.x, q.y, { X: q.c || '#ff5c86' });
    else if (q.k === 'z') sprite(SPR.z, q.x, q.y, { X: '#cfd8ff' });
    else if (q.k === 'note') sprite(SPR.note, q.x, q.y, { X: '#3a2b3f' });
    else if (q.k === 'spark') sprite(SPR.spark, q.x, q.y, { X: '#fff8b0' });
    else if (q.k === 'item') sprite(q.rows, q.x, q.y, q.map);
    else if (q.k === 'txt') { ctx.fillStyle = q.c; ctx.font = '6px sans-serif'; ctx.fillText(q.s, q.x, q.y); }
    else P(q.x, q.y, q.c);
  }
}

// ============ おやつキャッチ ============
function drawMG() {
  for (const it of mg.items) {

function updateMG(t, dt) {

  const pr = el / mg.dur;

    mg.items.push({ k: r < .14 + .1 * pr ? 'rock' : r < .26 ? 'star' : 'fruit', x: 4 + Math.random() * 55, y: -4, vy: .014 + Math.random() * .01 + pr * .016, c: pick(FRUITC) });
  }
  for (const it of mg.items) it.y += it.vy * dt;
  mg.items = mg.items.filter(it => {
    if (it.y > 64) return false;
    if (it.y + 3 >= petBox.y0 + 2 && it.y <= GROUND - 2 && it.x + 2 >= petBox.x0 + 3 && it.x <= petBox.x1 - 3) {

      return false;
    }
    return true;

  $('#hudR').textContent = `${mg.score}こ`;
}

function updateTripHud() { if (!trip) return; $('#hudL').textContent = PLACES[trip.place].name; $('#hudR').textContent = `みつけた ${trip.finds.length}/${trip.max}`; }
function drawTrip(t) {

}
function updateTrip(t, dt) {
  if (!trip.ending && trip.finds.length + (trip.dig ? 1 : 0) < trip.max && trip.spots.length < 2 && t > trip.nextSpawn) {
    trip.spots.push({ x: 7 + Math.random() * 50, born: t }); trip.nextSpawn = t + 1400 + Math.random() * 1800;
  }
  trip.spots = trip.spots.filter(s => t - s.born < 9000 || s === trip.dig);
  if (trip.digUntil) {

    return;

  if (trip.dig && Math.abs(trip.x - trip.dig.x) < 1.5) { trip.digUntil = t + 900; blip(300, .05, .03); return; }
  if (!trip.dig && t > trip.wanderAt && Math.abs(trip.target - trip.x) < 1) { trip.target = 10 + Math.random() * 44; trip.wanderAt = t + 2200 + Math.random() * 2500; }
  const d = trip.target - trip.x, sp = trip.dig ? .05 : .022;

  trip.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);

}
function rollFind() {
  const pl = trip.place, r = Math.random();
  const rareC = Object.keys(CLOTHES).find(k => CLOTHES[k].rare === pl);
  if (rareC && !S.clothes[rareC] && r < .06) return { kind: 'cloth', id: rareC };
  if (r < .2) return { kind: 'coin', n: 3 + Math.floor(Math.random() * 8) };
  const list = TREAS[pl], w = list.map(x => x.rare ? 1 : 5), sum = w.reduce((a, b) => a + b, 0);
  let k = Math.random() * sum; for (let i = 0; i < list.length; i++) { k -= w[i]; if (k <= 0) return { kind: 'treasure', id: list[i].id }; }
  return { kind: 'treasure', id: list[0].id };
}
function doFind(t) {

  } else {

    S.treasures[f.id] = (S.treasures[f.id] || 0) + 1;
    msg = `${tr.name}を みつけた！${first ? '（はじめて！）' : ''}`;
    particles.push({ k: 'item', rows: TPL[tr.tpl], map: tr.map, x: trip.x - 2, y: GROUND - 18, vx: 0, vy: -.008, life: 1500, born: t });

}

let lastT = performance.now();
function drawScene(t, dt) {
  ctx.clearRect(0, 0, 64, 64);
  if (trip) drawPlace(trip.place, t); else drawRoom(t);
  if (S.stage === 'egg') drawEgg(t); else drawPet(t);
  if (mg) drawMG();
  if (trip) drawTrip(t);
  drawParticles(t, dt);
}
function frame(t) {
  const dt = Math.min(50, t - lastT); lastT = t;
  if (anim && t - anim.start > anim.dur) anim = null;
  const paused = modal.classList.contains('show');
  if (mg && t >= mg.start) updateMG(t, dt);
  if (trip && !paused) updateTrip(t, dt);
  drawScene(t, dt);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`; ctx.fillRect(0, 0, 64, 64); flash -= dt / 700; }
  requestAnimationFrame(frame);

}

  }

  const pool = [babble, babble];
  if (L.length) pool.push(() => pick(L) + '！', () => pick(L) + '！');
  if (pn) pool.push(() => pn + '！');
  if (S.stage !== 'baby') {
    if (pn && L.length) pool.push(() => `${pn}、${pick(L)}！`);

// ============ おねがい進行 ============
function prog(type, v = 1, isMax = false) {
  const T = S.today; if (!T || !T.missions || S.stage === 'egg') return;
  T.m[type] = isMax ? Math.max(T.m[type] || 0, v) : (T.m[type] || 0) + v;

    if (T.done.length === T.missions.length) { S.coins += 20; toast('きょうのおねがい ぜんぶ達成！ ボーナス+20'); confetti(); }
  }
  save(); updateUI();
}

// ============ 時間経過 ============
function applyDecay() {
  if (S.stage === 'egg') { S.lastTick = now(); return; }
  const n = now(); let m = (n - S.lastTick) / 60000;
  if (m > 0) {
    m = Math.min(m, 60 * 24 * 3);
    S.hunger = clamp(S.hunger - m * .08);
    S.mood = clamp(S.mood - m * (S.hunger < 30 ? .12 : .04));
  }
  S.lastTick = n;
}
let awayDays = 0, newDay = false;
function dayCheck() {
  if (S.stage === 'egg' || !S.lastDay) return false;
  const t = dayStr(now());
  if (S.lastDay === t) return false;
  const gap = daysBetween(S.lastDay, t);
  S.streak = gap === 1 ? S.streak + 1 : 1;
  awayDays = gap - 1;
  S.days += 1; S.lastDay = t;
  S.today = newToday(t);
  S.affection += 5; S.coins += 10;
  if (S.streak > 0 && S.streak % 7 === 0) { diary(`${S.streak}日れんぞくで会いにきた`); S.coins += 30; }
  newDay = true; save();
  return true;
}

  setTimeout(() => { reunion = { phase: 'notice', start: performance.now() }; blip(900, .12, .05); bubble.classList.remove('show'); }, 2600);
  setTimeout(() => {

    else if (pn) line = `${pn}！！ ${pn}ーー！！${greetW ? '\n' + greetW + '！！' : ''}`;
    else line = `ぴぃぃぃーーっ！！\n（とびきりの笑顔で とびついてきた！）`;

function greet() {

function onCanvasTap(e) {
  const { x: lx, y: ly } = toLogical(e);
  if (mg) { mg.target = lx; return; }
  if (reunion) return;
  const hit = lx >= petBox.x0 && lx <= petBox.x1 && ly >= petBox.y0 && ly <= petBox.y1;
  if (trip) {
    if (trip.ending || trip.digUntil) return;
    const s = trip.spots.find(s => Math.abs(lx - s.x) < 5 && ly > GROUND - 10);
    if (s) { trip.dig = s; trip.target = s.x; blip(800, .04, .03); return; }
    if (hit) { hearts(); trip.happy = performance.now() + 500; S.mood = clamp(S.mood + 2); if (Math.random() < .5) say(talk('play')); return; }
    if (!trip.dig) { trip.target = clamp(lx, 8, 56); trip.wanderAt = performance.now() + 3000; }

    } else save();

  hearts();
  if (S.today.pets < 15) { S.affection += 1; S.today.pets++; }

  save(); updateUI(); prog('pet');

    const w = $('#iWord').value.trim().replace(/\s+/g, '');

function teach(word) {
  const today = dayStr(now());
  let w = S.words.find(x => x.t === word);
  if (w && w.learned) { closeModal(); wake(); startAnim('jump', 500); say(`${word}！\n（もう知ってるよ、という顔）`); return; }
  if (w && w.lastDay === today) { $('#tErr').textContent = 'そのことばは きょうはもう聞かせたよ。また明日！'; return; }
  closeModal(); wake();
  S.today.teach++; S.affection += 3;
  if (!w) { w = { t: word, n: 0, lastDay: '', learned: false }; S.words.push(w); }
  w.n++; w.lastDay = today;
  const cs = chars(word);
  startAnim('listen', 1300); prog('teach');
  setTimeout(() => {
    if (w.n >= need()) {
      w.learned = true; w.learnedAt = now();
      startAnim('jump', 700); confetti(); jingle();
      say(`${word}！ ${word}！`);
      diary(`「${word}」を覚えた！`);
      toast(`「${word}」を覚えた！`);
    } else if (w.n === 1) say(`${cs[0]}…？\n（じっと聞いている）`);
    else { const half = cs.slice(0, Math.ceil(cs.length / 2)).join(''); say(`${half}…${half}…？\n（あと すこしで覚えそう）`); }
    save(); updateUI(); checkGrowth();
  }, 1300);
  save(); updateUI();
}

// ============ 重複チェック（サーバーがあるときだけ） ============
async function ensureUnique() {
  if (!API_URL) return;
  for (let i = 0; i < 8; i++) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(API_URL + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: S.seed, look: G.look }), signal: ctl.signal });
      clearTimeout(to);
      const j = await r.json();
      if (j.ok) { S.registered = true; save(); return; }
      S.seed = newSeed(); G = makeGenes(S.seed);
    } catch (e) { return; }
  }
}

async function scheduleNotif() {
  try {
    const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (!LN || S.stage === 'egg' || !S.pet) return;
    await LN.requestPermissions();
    await LN.cancel({ notifications: [{ id: 1 }, { id: 2 }] });
    const at = days => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(19, 0, 0, 0); return d; };
    const pn = S.nameLevel >= 2 ? S.player : null;
    await LN.schedule({ notifications: [
      { id: 1, title: S.pet, body: pn ? `「${pn}、まだかな…？」` : `${S.pet}が まってるよ`, schedule: { at: at(1) } },
      { id: 2, title: S.pet, body: pn ? `「${pn}…さみしいよ…」` : `${S.pet}が さみしそうにしているよ…`, schedule: { at: at(3) } },
    ] });
  } catch (e) {}
}

}
function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; updateBGM(); }
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
PikoBGM.setVolume(.55);

// ============ 起動 ============
cv.addEventListener('pointerdown', onCanvasTap);
cv.addEventListener('pointermove', e => { if (mg) mg.target = toLogical(e).x; });
$('#aFeed').onclick = openFeed;
$('#aPlay').onclick = openPlay;
$('#aTeach').onclick = openTeach;
$('#aWear').onclick = () => openWear();
$('#aShop').onclick = () => openShop();
$('#aPhoto').onclick = takePhoto;
$('#aTreasure').onclick = () => openTreasure();
$('#aNote').onclick = () => openNote();
$('#mBtn').onclick = openMissions;
$('#btnSettings').onclick = openSettings;
$('#btnBgm').onclick = () => { S.bgm = !S.bgm; save(); audioUnlocked = true; updateBGM(); toast(S.bgm ? 'BGM オン' : 'BGM オフ'); };
$('#tripBack').onclick = () => { if (trip && !trip.ending) { trip.ending = true; say('（おうちに かえろう）'); setTimeout(endTrip, 900); } };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { applyDecay(); save(); scheduleNotif(); }
  else { applyDecay(); if (!mg && !trip && dayCheck()) greet(); updateUI(); }
  updateBGM();
});

if (location.hash === '#debug') {
  $('#debug').style.display = 'flex';
  $('#debug').onclick = e => {
    const d = e.target.dataset.d; if (!d || mg || trip) return;
    if (d === 'day') { S.dbg = (S.dbg || 0) + 1; applyDecay(); if (dayCheck()) greet(); }
    if (d === 'away') { S.dbg = (S.dbg || 0) + 3; applyDecay(); if (dayCheck()) greet(); }
    if (d === 'grow') { if (S.stage === 'baby') { S.days = Math.max(S.days, 3); S.affection = Math.max(S.affection, 20); } else if (S.stage === 'child') { S.days = Math.max(S.days, 7); S.affection = Math.max(S.affection, 60); } checkGrowth(); }
    if (d === 'hungry') S.hunger = clamp(S.hunger - 50);
    if (d === 'coin') S.coins += 100;
    if (d === 'reroll') { S.seed = newSeed(); G = makeGenes(S.seed); }
    if (d === 'reset') confirmReset();
    save(); updateUI();
  };
}

drawIcons();
updateBGM();
applyDecay();
dayCheck();
updateUI();
if (S.stage !== 'egg' && !S.player) openNaming();
else if (S.stage === 'egg') setTimeout(() => say(S.eggTaps ? '（たまごが うごいた気がする…）' : '（ふしぎなたまごをひろった。\nタップしてみよう）'), 500);
else greet();
setInterval(() => { updateBGM(); if (!mg && !trip && !reunion) { applyDecay(); if (dayCheck()) greet(); save(); updateUI(); } }, 20000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
